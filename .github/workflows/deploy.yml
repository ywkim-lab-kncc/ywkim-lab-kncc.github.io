# Builds the site and publishes it to GitHub Pages on every change to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:                      # also redeploy after a PubMed import
    workflows: ["Add publication from PubMed"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check data files
        run: npm run check
      - name: Build
        run: npx @11ty/eleventy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
