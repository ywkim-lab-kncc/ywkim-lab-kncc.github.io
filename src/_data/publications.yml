# ============================================================
#  PUBLICATIONS
# ------------------------------------------------------------
#  EASIEST: GitHub → Actions → "Add publication from PubMed" → Run workflow
#           → type one or more PMIDs. The entry is filled in from PubMed automatically.
#           Tick "Overwrite" to refresh an entry that is already listed.
#  BY HAND: copy a block below and edit. Order does not matter —
#           the site sorts by year automatically.
#
#  Fields
#    title, authors (list, in order), journal, year       ← required
#    volume, pages, doi, pmid                              ← optional
#    type       article | review | preprint | book | conference   (default: article)
#    selected   true → also shown on the home page and in "Selected"
#    note       short label, e.g. "Cover article"
#    code / data / pdf   optional URLs (GitHub repo, GEO accession, PDF)
#  Author markers:  "Kim Y*" = equal contribution,  "Kim Y†" = corresponding author
#  Lab members are bolded automatically (see pub_names in members.yml).
#
#  Seed list below: taken from the PI's NCC faculty page (ncc-gcsp.ac.kr).
#  Entries marked "verify": run the PubMed action with these PMIDs and tick
#  "Overwrite" to replace them with exact PubMed metadata.
# ============================================================

