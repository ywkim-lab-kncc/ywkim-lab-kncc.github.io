  pub_names: ["Kim Y", "Kim YW"]
  bio: >-
    Youngwook Kim studies the genomics of human cancer, with a particular focus on
    mitochondrial biology and cancer metabolism. His group combines statistical
    analysis of large-scale sequencing data with functional experiments to understand
    how genomic alterations shape tumor behavior.
  education:
    - "Ph.D., Molecular and Cellular Biology, Sungkyunkwan University"
    - "B.S., Molecular Biology (minor in Physics), Seoul National University"
  experience:
    - "Samsung Genome Institute, Samsung Medical Center"
    - "Samsung Advanced Institute for Health Sciences & Technology (SAIHST), Sungkyunkwan University"
  links:
